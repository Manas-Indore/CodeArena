<!DOCTYPE html>
<html>
<head>
  <title>CodeArena — Socket Test Client</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 20px; }
    input, select { width: 400px; padding: 6px; margin: 4px 0; }
    button { padding: 6px 12px; margin: 4px 4px 4px 0; cursor: pointer; }
    #log { white-space: pre-wrap; background: #000; padding: 10px; height: 400px; overflow-y: auto; border: 1px solid #444; margin-top: 10px; }
    .event { color: #0f0; }
    .error { color: #f55; }
    .section { border: 1px solid #333; padding: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>CodeArena Socket Test Client</h2>

  <div class="section">
    <label>JWT Token:</label><br/>
    <input id="token" placeholder="paste your token here" />
    <button onclick="connectSocket()">Connect</button>
  </div>

  <div class="section">
    <h3>Open / Group Battle Lobby</h3>
    <label>Match ID:</label><br/>
    <input id="matchId" placeholder="paste match id here" />
    <button onclick="joinLobby()">Join Lobby</button>
  </div>

  <div class="section">
    <h3>1v1 Matchmaking</h3>
    <select id="mode">
      <option value="speed_coding">Speed Coding</option>
      <option value="debug_duel">Debug Duel</option>
    </select>
    <button onclick="findMatch()">Find Match</button>
    <button onclick="cancelMatchmaking()">Cancel</button>
  </div>

  <div class="section">
    <h3>Challenge a Friend</h3>
    <label>Friend's User ID (UUID):</label><br/>
    <input id="friendUserId" placeholder="paste friend's user id here" />
    <select id="challengeMode">
      <option value="speed_coding">Speed Coding</option>
      <option value="debug_duel">Debug Duel</option>
    </select>
    <button onclick="challengeFriend()">Send Challenge</button>
  </div>

  <div id="log"></div>

  <script>
    let socket = null;

    function log(msg, cls = 'event') {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      line.className = cls;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }

    function connectSocket() {
      const token = document.getElementById('token').value.trim();
      if (!token) return alert('Paste a token first');

      socket = io('http://localhost:5000', {
        auth: { token },
      });

      socket.on('connect', () => log('Connected. Socket id: ' + socket.id));
      socket.on('connect_error', (err) => log('Connect error: ' + err.message, 'error'));
      socket.on('disconnect', () => log('Disconnected'));

      socket.on('lobby_update', (data) => log('lobby_update: ' + JSON.stringify(data)));
      socket.on('match_started', (data) => log('match_started: ' + JSON.stringify(data)));
      socket.on('progress_update', (data) => log('progress_update: ' + JSON.stringify(data)));
      socket.on('match_completed', (data) => log('match_completed: ' + JSON.stringify(data)));
      socket.on('queued', (data) => log('queued: ' + JSON.stringify(data)));
      socket.on('matchmaking_cancelled', (data) => log('matchmaking_cancelled: ' + JSON.stringify(data)));
      socket.on('challenge_received', (data) => log('challenge_received: ' + JSON.stringify(data)));
      socket.on('challenge_sent', (data) => log('challenge_sent: ' + JSON.stringify(data)));
      socket.on('error_message', (data) => log('error_message: ' + JSON.stringify(data), 'error'));
    }

    function joinLobby() {
      if (!socket) return alert('Connect first');
      const matchId = document.getElementById('matchId').value.trim();
      if (!matchId) return alert('Paste a match id first');
      socket.emit('join_lobby', { matchId });
      log('Emitted join_lobby for match ' + matchId);
    }

    function findMatch() {
      if (!socket) return alert('Connect first');
      const mode = document.getElementById('mode').value;
      socket.emit('find_match', { mode });
      log('Emitted find_match for mode ' + mode);
    }

    function cancelMatchmaking() {
      if (!socket) return alert('Connect first');
      const mode = document.getElementById('mode').value;
      socket.emit('cancel_matchmaking', { mode });
      log('Emitted cancel_matchmaking for mode ' + mode);
    }

    function challengeFriend() {
      if (!socket) return alert('Connect first');
      const friendUserId = document.getElementById('friendUserId').value.trim();
      const mode = document.getElementById('challengeMode').value;
      if (!friendUserId) return alert("Paste your friend's user id first");
      socket.emit('challenge_friend', { friendUserId, mode });
      log(`Emitted challenge_friend to ${friendUserId} (${mode})`);
    }
  </script>
</body>
</html>
